{% extends 'base.html' %}

{% block title %}Авторизация - СпортКомплекс{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="display-6 text-primary mb-2"><i class="bi bi-shield-lock-fill"></i></div>
        <h3>Авторизация</h3>
        <p class="text-muted small">Введите данные для входа в личный кабинет</p>
    </div>
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label class="form-label">Имя пользователя</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Логин" required autocomplete="off">
            </div>
        </div>
        
        <div class="mb-4">
            <label class="form-label">Пароль</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 py-2">
            Войти в систему <i class="bi bi-arrow-right ms-1"></i>
        </button>
    </form>
    
    <div class="text-center mt-4 pt-3 border-top">
        <p class="small text-muted mb-0">Ещё нет аккаунта? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none">Зарегистрироваться</a></p>
    </div>
</div>
{% endblock %}
