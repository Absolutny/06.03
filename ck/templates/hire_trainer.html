{% extends 'base.html' %}

{% block title %}Нанять тренера{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Регистрация учетной записи тренера</h3>
        <form method="POST" action="{{ url_for('hire_trainer') }}">
            <div class="mb-3">
                <label class="form-label">Логин тренера</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">ФИО Тренера</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
                <div class="form-text">Мин. 8 символов, заглавная буква, цифра и спецсимвол.</div>
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрировать тренера</button>
        </form>
    </div>
</div>
{% endblock %}
